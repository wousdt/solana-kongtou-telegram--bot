x-bot-image: &bot-image
  image: ${BOT_IMAGE:?请在.env填写私有BOT_IMAGE}
  restart: unless-stopped
  env_file: .env
  volumes:
    - ./data:/app/data
  depends_on:
    redis:
      condition: service_healthy

services:
  bot:
    <<: *bot-image
    command: ["node", "dist/index.js"]

  airdrop-worker:
    <<: *bot-image
    command: ["node", "dist/worker.js"]
    environment:
      WORKER_KIND: airdrop

  recovery-worker:
    <<: *bot-image
    command: ["node", "dist/worker.js"]
    environment:
      WORKER_KIND: recovery

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - ./redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    expose:
      - "6379"
